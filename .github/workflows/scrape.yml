name: scrape

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      recover_skroutz:
        description: "Recover only failed Skroutz categories on a fresh runner; keep other sources and skip enrichment reads"
        type: boolean
        default: false
      allow_history_shrink:
        description: "Planned data change (e.g. merging duplicate products): let history points disappear in this run only (they are logged)"
        type: boolean
        default: false
      allow_data_drop:
        description: "Planned data change: let the next Vercel build publish more than 30% fewer models/listings (tags the commit [allow-data-drop])"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with history.yml: the two data workflows never run at the same time; a new run waits
# (it is not cancelled) until the running one has pushed. Keep the group name identical in both.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full run (8 categories + the shipping refresh) takes ~40 min; the rest is headroom.
    timeout-minutes: 90
    steps:
      # The latest main when the job starts, not the commit of the moment it was triggered: a run
      # that waited in the queue must see what the run before it pushed (2026-09-30 data loss).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape
        env:
          RECOVER_SKROUTZ: ${{ inputs.recover_skroutz && 'true' || 'false' }}
        run: |
          if [ "$RECOVER_SKROUTZ" = true ]; then
            python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "scraper")
          from main import CATEGORIES, DATA_DIR, load_json
          failed = [cat for cat in CATEGORIES if load_json(DATA_DIR / cat / "latest.json", {}).get("sources", {}).get("skroutz", {}).get("ok") is not True]
          command = [sys.executable, "scraper/main.py", "--only", "skroutz", "--no-shipping", "--specs-budget", "0", "--makers-budget", "0"]
          for cat in failed:
              command.extend(["--category", cat])
          print("Skroutz recovery categories: " + (", ".join(failed) or "none"), flush=True)
          raise SystemExit(subprocess.call(command) if failed else 0)
          PY
          else
            python scraper/main.py
          fi

      - name: Commit data
        env:
          ALLOW_SHRINK: ${{ inputs.allow_history_shrink && '--allow-shrink' || '' }}
          DROP_TAG: ${{ inputs.allow_data_drop && ' [allow-data-drop]' || '' }}
        run: |
          # Commit as the repo owner: Vercel Hobby blocks deploys of commits by
          # authors it cannot map to the owner's Git account (e.g. github-actions[bot]).
          git config user.name "TeoAmpatzis"
          git config user.email "189219701+TeoAmpatzis@users.noreply.github.com"
          # History files merge point by point (.gitattributes); other data files: this run wins.
          git config merge.history.driver "python scraper/merge_history.py driver %O %A %B %P"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(data): update prices $(date -u +'%Y-%m-%d %H:%M')${DROP_TAG}"
          # Replay this commit on the latest main right before pushing, check that no history was
          # lost, push; if main moved again in between, do it again (3 tries).
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python scraper/merge_history.py check origin/main $ALLOW_SHRINK
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during the push (attempt $attempt); retrying"
            sleep 10
          done
          exit 1
