name: scrape

# Skroutz only. Cloudflare challenges GitHub's own IPs, so the scraper's requests go through Cloudflare
# WARP in proxy mode (SCRAPER_PROXY); a full run passed with 0 blocked requests on 2026-11-08.
# The other four sources run in scrape-shops.yml. No shipping, specs or price history here: those use
# Skroutz paths that robots.txt disallows.
on:
  schedule:
    - cron: "13 */4 * * *" # wakes every 4 h, but the gate below lets a run go ahead only when the data is older than 11 h: two real runs a day, a failed one retried within hours
  workflow_dispatch:
    inputs:
      allow_history_shrink:
        description: "Planned data change (e.g. merging duplicate products): let history points disappear in this run only (they are logged)"
        type: boolean
        default: false
      allow_data_drop:
        description: "Planned data change: let the next Vercel build publish more than 30% fewer models/listings (tags the commit [allow-data-drop])"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with history.yml: the two data workflows never run at the same time; a new run waits
# (it is not cancelled) until the running one has pushed. Keep the group name identical in both.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # Freshness gate (scripts/checks/skroutz_gate.py): a scheduled run goes ahead only when the published Skroutz
  # data is older than 11 h (so normally two real runs a day, fewer requests from the shared WARP IP) and the last
  # run did not fail less than 3 h ago. A failed run is retried within hours, which keeps the site's Skroutz data
  # under its 24 h "outdated" mark; a challenged IP is still not hammered. A manual run always goes ahead.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.freshness.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/checks/skroutz_gate.py

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # A full Skroutz run (9 categories) took about 12 minutes through WARP; the rest is headroom.
    timeout-minutes: 90
    steps:
      # The latest main when the job starts, not the commit of the moment it was triggered: a run
      # that waited in the queue must see what the run before it pushed (2026-09-30 data loss).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Snapshot Skroutz coverage before collection
        id: before
        run: python scripts/checks/validate_skroutz.py snapshot "$RUNNER_TEMP/skroutz-before.json"

      - name: Cloudflare WARP in proxy mode (only the scraper uses it)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 5
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status | grep -q Connected

      - name: Scrape
        env:
          SCRAPER_PROXY: socks5h://127.0.0.1:40000
        run: python -u scraper/main.py --only skroutz --no-shipping --specs-budget 0 --makers-budget 0

      - name: Record collection window
        id: finished
        if: always() && steps.before.outcome == 'success'
        run: python scripts/checks/validate_skroutz.py finish "$RUNNER_TEMP/skroutz-before.json"

      - name: Commit data
        id: publish
        env:
          ALLOW_SHRINK: ${{ inputs.allow_history_shrink && '--allow-shrink' || '' }}
          DROP_TAG: ${{ inputs.allow_data_drop && ' [allow-data-drop]' || '' }}
        run: |
          # Commit as the repo owner: Vercel Hobby blocks deploys of commits by
          # authors it cannot map to the owner's Git account (e.g. github-actions[bot]).
          git config user.name "TeoAmpatzis"
          git config user.email "189219701+TeoAmpatzis@users.noreply.github.com"
          # History files merge point by point (.gitattributes); other data files: this run wins.
          git config merge.history.driver "python scraper/merge_history.py driver %O %A %B %P"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
            echo "data_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): update prices $(date -u +'%Y-%m-%d %H:%M')${DROP_TAG}"
          # Replay this commit on the latest main right before pushing, check that no history was
          # lost, push; if main moved again in between, do it again (3 tries).
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python scraper/merge_history.py check origin/main $ALLOW_SHRINK
            if git push origin HEAD:main; then
              echo "data_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved during the push (attempt $attempt); retrying"
            sleep 10
          done
          exit 1

      - name: Require fresh complete Skroutz categories in the published commit (every category Skroutz lists, see scraper/capabilities.py)
        if: always() && steps.publish.outcome == 'success' && steps.finished.outcome == 'success'
        env:
          DATA_COMMIT: ${{ steps.publish.outputs.data_commit }}
        run: python scripts/checks/validate_skroutz.py check "$RUNNER_TEMP/skroutz-before.json" --ref "$DATA_COMMIT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skroutz-validation-${{ github.run_id }}
          path: skroutz-validation.json
          if-no-files-found: warn
