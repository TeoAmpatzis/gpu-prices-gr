name: scrape

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full run (8 categories + the shipping refresh) takes ~40 min; the rest is headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape
        run: python scraper/main.py

      - name: Commit data
        run: |
          # Commit as the repo owner: Vercel Hobby blocks deploys of commits by
          # authors it cannot map to the owner's Git account (e.g. github-actions[bot]).
          git config user.name "TeoAmpatzis"
          git config user.email "189219701+TeoAmpatzis@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): update prices $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
