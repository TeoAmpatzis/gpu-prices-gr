name: history

# Imports Skroutz's own price history for models not imported yet (scraper/site_history.py),
# a slow batch per day so Skroutz isn't flooded. Shares the "scrape" group so it never runs at the
# same time as a price scrape (both commit public/data).
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    # 8 categories × 60 requests × ~6.5 s ≈ 52 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Import price history
        run: python scraper/main.py --history-only

      - name: Commit data
        run: |
          # Same identity as the scrape workflow: Vercel Hobby only deploys commits it can map to the owner.
          git config user.name "TeoAmpatzis"
          git config user.email "189219701+TeoAmpatzis@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): import price history $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
