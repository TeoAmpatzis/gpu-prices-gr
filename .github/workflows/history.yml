name: history

# Imports Skroutz's own price history for models not imported yet (scraper/site_history.py),
# a slow batch per day so Skroutz isn't flooded. Shares the "scrape" concurrency group so it never
# runs at the same time as a price scrape (both commit public/data).
# PAUSED 2026-11-09 (owner approved): the Skroutz price_graph path is disallowed by its robots.txt and
# this job has no WARP proxy, so every run is Cloudflare-blocked and imports nothing. Scheduled runs are
# off; restore_from below still works by hand. Re-enable the cron only after the robots question is settled.
on:
  workflow_dispatch:
    inputs:
      restore_from:
        description: "Recovery: merge the history files of this commit into the current ones instead of importing (scraper/merge_history.py restore)"
        type: string
        default: ""
      allow_history_shrink:
        description: "Planned data change: let history points disappear in this run only (they are logged)"
        type: boolean
        default: false
      clean_glitches:
        description: "One-off (owner's OK): remove Skroutz import glitches and reset their bad lows before importing (scraper/glitches.py clean); needs allow_history_shrink"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    # 8 categories × 60 requests × ~6.5 s ≈ 52 min.
    timeout-minutes: 90
    steps:
      # A restore run never imports, so it would skip the clean-up without a word: refuse the combination.
      - name: Check inputs
        if: inputs.clean_glitches && inputs.restore_from != ''
        run: |
          echo "clean_glitches and restore_from cannot run together: run the restore first, then a separate run with clean_glitches + allow_history_shrink"
          exit 1

      # The latest main when the job starts (see scrape.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Restore history from a commit
        if: inputs.restore_from != ''
        env:
          COMMIT: ${{ inputs.restore_from }}
        run: |
          git fetch --depth=1 origin "$COMMIT"
          python scraper/merge_history.py restore "$COMMIT"

      # Never on the schedule: inputs are empty there, so this only runs from a manual dispatch.
      - name: Clean import glitches
        if: inputs.restore_from == '' && inputs.clean_glitches
        env:
          SHRINK: ${{ inputs.allow_history_shrink }}
        run: |
          # It removes history points: without the shrink input the push guard would refuse them after ~50 min of imports.
          if [ "$SHRINK" != "true" ]; then
            echo "clean_glitches needs allow_history_shrink in the same run"
            exit 1
          fi
          python scraper/glitches.py clean

      - name: Import price history
        if: inputs.restore_from == ''
        run: python scraper/main.py --history-only

      - name: Commit data
        env:
          ALLOW_SHRINK: ${{ inputs.allow_history_shrink && '--allow-shrink' || '' }}
          WHAT: ${{ inputs.restore_from != '' && format('restore price history from {0}', inputs.restore_from) || inputs.clean_glitches && 'clean import glitches + import price history' || 'import price history' }}
        run: |
          # Same identity as the scrape workflow: Vercel Hobby only deploys commits it can map to the owner.
          git config user.name "TeoAmpatzis"
          git config user.email "189219701+TeoAmpatzis@users.noreply.github.com"
          git config merge.history.driver "python scraper/merge_history.py driver %O %A %B %P"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(data): $WHAT $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python scraper/merge_history.py check origin/main $ALLOW_SHRINK
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during the push (attempt $attempt); retrying"
            sleep 10
          done
          exit 1
