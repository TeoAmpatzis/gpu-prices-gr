name: Skroutz experiments

# Read-only: three spaced requests to one Skroutz category per browser profile, to see whether any
# profile gets listings from GitHub's runners. Writes no data. Delete this file when done.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    if: false # experiment 1 done: every profile got 403 challenge from GitHub's runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [chrome, safari, firefox, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scripts/checks/probe_strategies.py --impersonate ${{ matrix.profile }}

  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Cloudflare WARP in proxy mode (only the test requests use it)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 5
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | head -12
      - run: python scripts/checks/probe_strategies.py --impersonate chrome --proxy socks5h://127.0.0.1:40000
