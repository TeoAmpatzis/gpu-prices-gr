name: Skroutz diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only probe or full Skroutz listing validation
        type: choice
        options: [probe, listings, connections]
        default: probe

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install baseline dependencies
        run: pip install -r scraper/requirements.txt curl_cffi==0.16.3 selectolax==0.4.13
      - name: Test probe
        run: python scripts/checks/test_probe_skroutz.py
      - name: Collect three bounded probes
        shell: python
        run: |
          import json, subprocess, sys, time
          from pathlib import Path
          results = []
          for index in range(3):
              if index:
                  time.sleep(30)
              run = subprocess.run([sys.executable, "scripts/checks/probe_skroutz.py"], capture_output=True, text=True)
              if run.stdout.strip():
                  print(run.stdout.strip(), flush=True)
              try:
                  result = json.loads(run.stdout)
              except ValueError:
                  result = {"result": "probe_error", "exit_code": run.returncode}
              results.append(result)
          Path("skroutz-probes.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          sys.exit(0 if all(row["result"] == "ok" for row in results) else 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skroutz-probes-${{ github.run_id }}
          path: skroutz-probes.json
          if-no-files-found: warn

  connections:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'connections'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt curl_cffi==0.16.3 selectolax==0.4.13
      - name: Prove challenged-connection recovery locally
        run: python scripts/checks/test_http_recovery.py
      - name: Fetch trusted released control client
        run: |
          git fetch --no-tags --depth=1 origin b6c234f82fe01f96738247369ed89f08ed8979f0
          git show b6c234f82fe01f96738247369ed89f08ed8979f0:scraper/http_client.py > control-http.py
      - name: Compare retry connections on category first pages
        run: python -u scripts/checks/probe_skroutz_connections.py control-http.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skroutz-connections-${{ github.run_id }}
          path: skroutz-connections.json
          if-no-files-found: warn

  listings:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'listings'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Test validation
        run: python scripts/checks/test_skroutz_validation.py
      - name: Snapshot source data
        id: snapshot
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python scripts/checks/validate_skroutz.py snapshot skroutz-baseline.json
      - name: Scrape Skroutz listings without publishing
        shell: bash
        run: python -u scraper/main.py --only skroutz --no-shipping --specs-budget 0 --makers-budget 0 | tee skroutz-scrape.log
      - name: Require fresh, complete Skroutz results
        if: always() && steps.snapshot.outcome == 'success'
        run: python scripts/checks/validate_skroutz.py check skroutz-baseline.json
      - name: Preserve history
        if: always() && steps.snapshot.outcome == 'success'
        run: python scraper/merge_history.py check "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skroutz-listings-${{ github.run_id }}
          path: |
            skroutz-baseline.json
            skroutz-validation.json
            skroutz-scrape.log
          if-no-files-found: warn
