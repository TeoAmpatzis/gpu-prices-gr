name: scrape-peripherals

# Monitors, mice and headphones from the four shops, on their own schedule and time limit so that their long BestPrice
# lists (headphones: 30 price slices, about 27 minutes) do not use up scrape-shops.yml's 90 minutes (Skroutz's Cloudflare blocks them; see scrape.yml).
# Two jobs, one after the other: prices (list pages and shipping) are committed first, spec pages after.
# Every phase is one line of requests to BestPrice, so the jobs never run side by side and there is no
# job per category (docs/superpowers/plans/2026-11-11-scraper-run-split.md).
# Add a new source: list it in --only in BOTH jobs here and in scrape-shops.yml (scripts/checks/test_workflows.py checks they agree).
# A new peripheral category goes in --category here and in --skip-category in scrape-shops.yml.
on:
  schedule:
    - cron: "43 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      allow_history_shrink:
        description: "Planned data change: let history points disappear in this run only (they are logged)"
        type: boolean
        default: false
      allow_data_drop:
        description: "Planned data change: let the next Vercel build publish more than 30% fewer models/listings (tags the commit [allow-data-drop])"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with scrape.yml and history.yml: the data workflows never run at the same time.
concurrency:
  group: scrape
  cancel-in-progress: false


jobs:
  # List pages and shipping, then the commit: prices are public before the slow spec pages start.
  # Stored specs are applied again; no spec page and no maker page is fetched here.
  prices:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The latest main when the job starts, not the commit of the moment it was triggered: a run
      # that waited in the queue must see what the run before it pushed (2026-09-30 data loss).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Scrape prices
        run: python -u scraper/main.py --only bestprice --only eshop --only shopflix --only snif --category monitor --category mouse --category headphones --specs-budget 0 --makers-budget 0

      - name: Commit data
        uses: ./.github/actions/commit-data
        with:
          what: update prices
          allow_shrink: ${{ inputs.allow_history_shrink }}
          drop_tag: ${{ inputs.allow_data_drop }}

  # Product pages for specs (the shops' and the makers'), on the data the prices job just pushed.
  # Skipped when prices failed: a blocked shop is not asked again in the same run.
  specs:
    needs: prices
    runs-on: ubuntu-latest
    # 150 BestPrice pages at about 7.5 s are 19 minutes; the rest is headroom.
    timeout-minutes: 60
    steps:
      # The latest main: it holds the commit of the prices job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Collect specs
        run: python -u scraper/main.py --specs-only --only bestprice --only eshop --only shopflix --only snif --category monitor --category mouse --category headphones

      - name: Commit data
        uses: ./.github/actions/commit-data
        with:
          what: update specs
          allow_shrink: ${{ inputs.allow_history_shrink }}
          drop_tag: ${{ inputs.allow_data_drop }}
