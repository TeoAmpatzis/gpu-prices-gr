name: CI

# Type check, lint, unit tests, build and browser tests. On code changes the tests run on the data pinned in
# .ci-data-ref (scripts/checks/pin-data.mjs), so a red run means the code broke: the scrapes change public/data every few
# hours and on 2026-11-14 that alone turned CI red five times. The daily scheduled run (and a manual run with live=true)
# tests the live data instead; a red one there is a data problem, it blocks no pull request.
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
  pull_request:
    paths-ignore:
      - "public/data/**"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Test the live data of the branch instead of the pinned data"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:apply-data
        if: github.event_name != 'schedule' && !inputs.live
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:apply-data
        if: github.event_name != 'schedule' && !inputs.live
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
